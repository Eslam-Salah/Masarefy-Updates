name: GitHub Actions runner diagnostic (no source checkout)
on:
  push:
    branches: [main]
    paths: ['.github/workflows/actions-runner-health.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  runner-check:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Runner assigned
        run: echo "Runner started successfully"
