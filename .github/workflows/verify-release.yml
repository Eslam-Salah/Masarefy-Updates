name: Verify published Masarefy releases (NEW signing identity)

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Check official APK checksum and replacement signing certificate
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ github.event.release.tag_name || '' }}
    steps:
      - name: Resolve release and download APK and checksum
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "$RELEASE_TAG" ]; then
            RELEASE_TAG="$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName --jq .tagName)"
          fi
          test -n "$RELEASE_TAG"
          mkdir -p release
          gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
            --pattern '*.apk' --pattern '*.apk.sha256' --dir release
          test "$(find release -maxdepth 1 -name '*.apk' -type f | wc -l)" -eq 1
          test "$(find release -maxdepth 1 -name '*.apk.sha256' -type f | wc -l)" -eq 1
          (cd release && sha256sum --check *.apk.sha256)
          echo "RELEASE_TAG=$RELEASE_TAG" >> "$GITHUB_ENV"

      - name: Install Android signing tools
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -path '*/bin/sdkmanager' -type f | sort -V | tail -1)"
          test -n "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" 'build-tools;36.0.0'

      - name: Assert new certificate, package name and tag/version match
        shell: bash
        run: |
          set -euo pipefail
          APK="$(find release -maxdepth 1 -name '*.apk' -type f | head -1)"
          TOOLS="$ANDROID_HOME/build-tools/36.0.0"
          "$TOOLS/apksigner" verify --verbose --print-certs "$APK" > "$RUNNER_TEMP/signer.txt"
          grep -Fi 'Signer #1 certificate SHA-256 digest: fad87f51fe359d06837c915c20f044b1311fea600643e1726649da3f1243e155' "$RUNNER_TEMP/signer.txt"
          BADGING="$("$TOOLS/aapt" dump badging "$APK")"
          echo "$BADGING" | grep -F "package: name='com.masarefy.app'"
          VERSION="$(echo "$BADGING" | sed -nE "s/^package: name='com.masarefy.app' versionCode='[0-9]+' versionName='([^']+)'.*/\1/p" | head -1)"
          test "v$VERSION" = "$RELEASE_TAG"
          if [ "$RELEASE_TAG" = v1.0.0 ]; then
            echo "$BADGING" | grep -F "versionCode='1' versionName='1.0.0'"
          fi
          echo 'Verified new-signature release and its public checksum.' >> "$GITHUB_STEP_SUMMARY"
