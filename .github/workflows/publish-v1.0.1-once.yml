name: Publish verified Masarefy v1.0.1 signed APK

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-v1.0.1-once.yml'

permissions:
  contents: write

jobs:
  publish-reviewed-apk:
    if: github.repository == 'Eslam-Salah/Masarefy-Updates'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Download signed APK archive (no private key)
        shell: bash
        env:
          SIGNED_ARCHIVE_URL: 'https://sdmntpritalynorth.oaiusercontent.com/files/00000000-f968-8246-9c6f-b6d2768d0e53/raw?se=2026-11-14T21%3A56%3A17Z&sp=r&sv=2026-06-06&sr=b&scid=e8b97766-dc75-5916-8e18-b3b4b75b8aef&skoid=82a3371f-2f6c-4f81-8a78-2701b362559b&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-11-14T16%3A52%3A12Z&ske=2026-11-15T16%3A52%3A12Z&sks=b&skv=2026-06-06&sig=y%2BVc9MU5/w0ZQppzV9KA38rnru5wPN/fnIiBQNyv1Q0%3D'
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/masarefy-release"
          curl --fail --location --silent --show-error --retry 2 --connect-timeout 15 --max-time 120 \
            "$SIGNED_ARCHIVE_URL" --output "$RUNNER_TEMP/masarefy-signed.zip"
          test -s "$RUNNER_TEMP/masarefy-signed.zip"
          unzip -tqq "$RUNNER_TEMP/masarefy-signed.zip"
          test "$(unzip -Z1 "$RUNNER_TEMP/masarefy-signed.zip" | wc -l)" -eq 2
          unzip -Z1 "$RUNNER_TEMP/masarefy-signed.zip" | grep -Fx 'Masarefy-v1.0.1.apk'
          unzip -Z1 "$RUNNER_TEMP/masarefy-signed.zip" | grep -Fx 'Masarefy-v1.0.1.apk.sha256'
          unzip -qq "$RUNNER_TEMP/masarefy-signed.zip" -d "$RUNNER_TEMP/masarefy-release"
          cd "$RUNNER_TEMP/masarefy-release"
          sha256sum --check Masarefy-v1.0.1.apk.sha256
          echo '5305dcb07bf808292eb20a881af1f8a6ee66af53064c6f60413eb1a060940ba4  Masarefy-v1.0.1.apk' | sha256sum --check

      - name: Install Android signing verification tools
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -path '*/bin/sdkmanager' -type f | sort -V | tail -1)"
          test -n "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" 'build-tools;36.0.0'

      - name: Verify original release certificate and APK version before publication
        shell: bash
        run: |
          set -euo pipefail
          APK="$RUNNER_TEMP/masarefy-release/Masarefy-v1.0.1.apk"
          TOOLS="$ANDROID_HOME/build-tools/36.0.0"
          "$TOOLS/apksigner" verify --verbose --print-certs "$APK" | tee "$RUNNER_TEMP/cert-result.txt"
          grep -Fi 'Signer #1 certificate SHA-256 digest: 7c700938865ff6bd655808547d300fd5bf127da76d74b7a6ba9c9fd402993ac5' "$RUNNER_TEMP/cert-result.txt"
          "$TOOLS/aapt" dump badging "$APK" |
            grep -F "package: name='com.masarefy.app' versionCode='2' versionName='1.0.1'"

      - name: Publish v1.0.1 signed APK and checksum to this public release channel
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view v1.0.1 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo 'v1.0.1 already exists; refusing to overwrite an existing release.' >&2
            exit 1
          fi
          cat > "$RUNNER_TEMP/masarefy-release/RELEASE_NOTES.md" <<'NOTES'
          تحسينات الإصدار 1.0.1 من مصاريفي

          - تحسين تصميم الصفحة الرئيسية وعرض الدخل والمصروفات والالتزامات والادخار.
          - تحسين عرض المبالغ والتصنيفات الطويلة وأشرطة التقدم في الوضعين الفاتح والداكن.
          - جعل إخفاء الأرقام المالية فوريًا عند تفعيل وضع الخصوصية.
          - تحسين الاستقرار والاختبارات دون إضافة وظائف جديدة أو تغيير بيانات المستخدم.

          تم التوقيع بنفس شهادة الإصدار v1.0.0، واجتاز التحديث اختبار الترقية فوق النسخة الرسمية على محاكي Android مع الاحتفاظ ببيانات اختبارية.
          NOTES
          cd "$RUNNER_TEMP/masarefy-release"
          gh release create v1.0.1 Masarefy-v1.0.1.apk Masarefy-v1.0.1.apk.sha256 \
            --repo "$GITHUB_REPOSITORY" --title 'مصاريفي v1.0.1' \
            --notes-file RELEASE_NOTES.md --latest

      - name: Confirm published release and SHA-256 assets
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release view v1.0.1 --repo "$GITHUB_REPOSITORY" --json tagName,assets,url
          mkdir -p "$RUNNER_TEMP/downloaded-release"
          gh release download v1.0.1 --repo "$GITHUB_REPOSITORY" \
            --pattern '*.apk' --pattern '*.apk.sha256' --dir "$RUNNER_TEMP/downloaded-release"
          cd "$RUNNER_TEMP/downloaded-release"
          sha256sum --check Masarefy-v1.0.1.apk.sha256
          echo '5305dcb07bf808292eb20a881af1f8a6ee66af53064c6f60413eb1a060940ba4  Masarefy-v1.0.1.apk' | sha256sum --check
