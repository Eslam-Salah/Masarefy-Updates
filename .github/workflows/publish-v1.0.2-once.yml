name: Publish verified Masarefy v1.0.2 signed APK

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-v1.0.2-once.yml'

permissions:
  contents: write

jobs:
  publish-reviewed-apk:
    if: github.repository == 'Eslam-Salah/Masarefy-Updates'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Download signed APK archive (never download a private signing key)
        shell: bash
        env:
          SIGNED_ARCHIVE_URL: 'https://sdmntpritalynorth.oaiusercontent.com/files/00000000-0d34-8246-b4c0-174c39ca046b/raw?se=2026-11-15T00%3A40%3A30Z&sp=r&sv=2026-06-06&sr=b&scid=6542dc23-a562-50ed-baa1-0266d8e8852f&skoid=82a3371f-2f6c-4f81-8a78-2701b362559b&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-11-14T03%3A29%3A44Z&ske=2026-11-15T03%3A29%3A44Z&sks=b&skv=2026-06-06&sig=2E6ssj3RdNwSGckuZVGpN2HhMRW8rci/2INNRXcU7/k%3D'
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/masarefy-release"
          curl --fail --location --silent --show-error --retry 2 --connect-timeout 15 --max-time 120 \
            "$SIGNED_ARCHIVE_URL" --output "$RUNNER_TEMP/masarefy-signed.zip"
          test -s "$RUNNER_TEMP/masarefy-signed.zip"
          unzip -tqq "$RUNNER_TEMP/masarefy-signed.zip"
          test "$(unzip -Z1 "$RUNNER_TEMP/masarefy-signed.zip" | wc -l)" -eq 2
          unzip -Z1 "$RUNNER_TEMP/masarefy-signed.zip" | grep -Fx 'Masarefy-v1.0.2.apk'
          unzip -Z1 "$RUNNER_TEMP/masarefy-signed.zip" | grep -Fx 'Masarefy-v1.0.2.apk.sha256'
          unzip -qq "$RUNNER_TEMP/masarefy-signed.zip" -d "$RUNNER_TEMP/masarefy-release"
          cd "$RUNNER_TEMP/masarefy-release"
          sha256sum --check Masarefy-v1.0.2.apk.sha256
          echo '8aa89bcd47225bbb2b8895752a09185f6bb84466678b7005beb44e4a12a2b3be  Masarefy-v1.0.2.apk' | sha256sum --check

      - name: Install Android signing verification tools
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -path '*/bin/sdkmanager' -type f | sort -V | tail -1)"
          test -n "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" 'build-tools;36.0.0'

      - name: Verify official release certificate and app version
        shell: bash
        run: |
          set -euo pipefail
          APK="$RUNNER_TEMP/masarefy-release/Masarefy-v1.0.2.apk"
          TOOLS="$ANDROID_HOME/build-tools/36.0.0"
          "$TOOLS/apksigner" verify --verbose --print-certs "$APK" | tee "$RUNNER_TEMP/cert-result.txt"
          grep -Fi 'Signer #1 certificate SHA-256 digest: 7c700938865ff6bd655808547d300fd5bf127da76d74b7a6ba9c9fd402993ac5' "$RUNNER_TEMP/cert-result.txt"
          "$TOOLS/aapt" dump badging "$APK" |
            grep -F "package: name='com.masarefy.app' versionCode='3' versionName='1.0.2'"

      - name: Publish v1.0.2 signed APK and SHA-256
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view v1.0.2 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo 'v1.0.2 already exists; refusing to overwrite.' >&2
            exit 1
          fi
          cat > "$RUNNER_TEMP/masarefy-release/RELEASE_NOTES.md" <<'NOTES'
          مصاريفي 1.0.2 — تحسينات الاستخدام

          - حذف اختصار «فحص الإشعارات» من الإعدادات دون تعطيل التذكيرات والإشعارات.
          - نقل زر «اسأل مصاريفي» إلى زر عائم ثابت أسفل الصفحة الرئيسية.
          - ضبط مساحة التمرير حتى لا يحجب الزر الكروت أو المعاملات.
          - تحسين اختبارات واجهة التطبيق والثبات دون تغيير البيانات أو إضافة وظائف جديدة.

          تم توقيعه بنفس شهادة الإصدارات السابقة، واجتاز اختبار الترقية الفعلية من APK v1.0.1 الرسمي على محاكي Android مع الحفاظ على بيانات مالية تجريبية.
          NOTES
          cd "$RUNNER_TEMP/masarefy-release"
          gh release create v1.0.2 Masarefy-v1.0.2.apk Masarefy-v1.0.2.apk.sha256 \
            --repo "$GITHUB_REPOSITORY" --title 'مصاريفي v1.0.2' \
            --notes-file RELEASE_NOTES.md --latest

      - name: Verify public artifacts after publication
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release view v1.0.2 --repo "$GITHUB_REPOSITORY" --json tagName,assets,url
          mkdir -p "$RUNNER_TEMP/recheck"
          gh release download v1.0.2 --repo "$GITHUB_REPOSITORY" \
            --pattern '*.apk' --pattern '*.apk.sha256' --dir "$RUNNER_TEMP/recheck"
          cd "$RUNNER_TEMP/recheck"
          sha256sum --check Masarefy-v1.0.2.apk.sha256
          echo '8aa89bcd47225bbb2b8895752a09185f6bb84466678b7005beb44e4a12a2b3be  Masarefy-v1.0.2.apk' | sha256sum --check
