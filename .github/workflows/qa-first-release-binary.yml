name: Android clean-install QA for signed first v1.0.0 (public binary only)

on:
  push:
    branches: [main]
    paths: ['.github/qa-payload/first-v100-download.txt']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  binary-smoke:
    if: github.repository == 'Eslam-Salah/Masarefy-Updates'
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4

      - name: Read trusted temporary signed APK archive pointer
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t lines < .github/qa-payload/first-v100-download.txt
          test "${#lines[@]}" -eq 2
          [[ "${lines[0]}" =~ ^[a-f0-9]{64}$ ]] || exit 2
          [[ "${lines[1]}" == https://sdmntpritalynorth.oaiusercontent.com/files/* ]] || exit 2
          echo "APK_SHA=${lines[0]}" >> "$GITHUB_ENV"
          echo "ARCHIVE_URL=${lines[1]}" >> "$GITHUB_ENV"

      - name: Download candidate while link is live; verify signed APK SHA256
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/qa"
          curl --fail --location --silent --show-error --retry 3 --connect-timeout 20 \
            --max-time 150 "$ARCHIVE_URL" -o "$RUNNER_TEMP/qa.zip"
          unzip -tqq "$RUNNER_TEMP/qa.zip"
          test "$(unzip -Z1 "$RUNNER_TEMP/qa.zip" | wc -l)" -eq 2
          unzip -Z1 "$RUNNER_TEMP/qa.zip" | grep -Fx 'Masarefy-v1.0.0.apk'
          unzip -Z1 "$RUNNER_TEMP/qa.zip" | grep -Fx 'Masarefy-v1.0.0.apk.sha256'
          unzip -qq "$RUNNER_TEMP/qa.zip" -d "$RUNNER_TEMP/qa"
          (cd "$RUNNER_TEMP/qa" && sha256sum -c Masarefy-v1.0.0.apk.sha256)
          echo "$APK_SHA  $RUNNER_TEMP/qa/Masarefy-v1.0.0.apk" | sha256sum -c

      - name: Prepare Android SDK Build Tools
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -path '*/bin/sdkmanager' -type f | sort -V | tail -1)"
          test -n "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" 'build-tools;36.0.0'

      - name: Check exact Android application and NEW certificate
        shell: bash
        run: |
          set -euo pipefail
          APK="$RUNNER_TEMP/qa/Masarefy-v1.0.0.apk"
          TOOLS="$ANDROID_HOME/build-tools/36.0.0"
          "$TOOLS/apksigner" verify --verbose --print-certs "$APK" > "$RUNNER_TEMP/verified-cert.txt"
          grep -Fi 'Signer #1 certificate SHA-256 digest: fad87f51fe359d06837c915c20f044b1311fea600643e1726649da3f1243e155' "$RUNNER_TEMP/verified-cert.txt"
          "$TOOLS/aapt" dump badging "$APK" | grep -F "package: name='com.masarefy.app' versionCode='1' versionName='1.0.0'"

      - name: Enable hardware KVM for stable Android emulator
        shell: bash
        run: |
          set -euo pipefail
          test -e /dev/kvm || { echo 'KVM device unavailable on runner'; exit 1; }
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          sudo chmod a+rw /dev/kvm
          test -r /dev/kvm && test -w /dev/kvm || {
            echo 'Cannot access /dev/kvm; refusing to run slow, unreliable software emulator' >&2
            exit 1
          }
          echo 'PASS: KVM is readable and writable by this runner.'

      - name: Install, start and screenshot new app on clean Android 14 emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: default
          arch: x86_64
          profile: pixel_5
          ram-size: 4096M
          heap-size: 512M
          disable-animations: true
          disable-linux-hw-accel: false
          emulator-boot-timeout: 1200
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: bash .github/scripts/qa-first-install.sh

      - name: Preserve first-launch screenshot and manifest for review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Masarefy-v1.0.0-Android14-first-launch-QA
          path: |
            ${{ runner.temp }}/qa/first-launch.png
            ${{ runner.temp }}/qa/first-launch-after-45s.png
            ${{ runner.temp }}/qa/qa-view.xml
            ${{ runner.temp }}/qa/activity-top.txt
            ${{ runner.temp }}/qa/window-focus.txt
            ${{ runner.temp }}/qa/gfxinfo.txt
            ${{ runner.temp }}/qa/logcat.txt
            ${{ runner.temp }}/verified-cert.txt
          if-no-files-found: warn
          retention-days: 14

      - name: Summarize checks for release handoff
        if: success()
        shell: bash
        run: |
          printf '%s\n' 'PUBLIC BINARY QA PASS: clean Android 14 install, live app process, screenshot, version/build/certificate/hash.' >> "$GITHUB_STEP_SUMMARY"
          printf 'APK SHA-256: %s\n' "$APK_SHA" >> "$GITHUB_STEP_SUMMARY"
